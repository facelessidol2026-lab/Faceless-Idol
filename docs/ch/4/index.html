<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D0C">
<title>Gün 2 - Vurğun (İspan) — Simasız Büt — bə 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@300;400;500&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0D0C;
    --paper:#E8E1D0;
    --paper-dim:#8A8378;
    --gold:#B08D57;
    --wine:#7A2E2E;
    --accent:#B08D57;
    --astral:#7B68EE;
    --soul:#FFD700;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:'Work Sans',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* ===== 3D CANVAS ===== */
  #cosmos{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }

  /* ===== БАЗОВЫЙ ДИЗАЙН ===== */
  .numeral{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond',serif;
    font-size:min(50vw,50vh);
    font-weight:600;
    color:var(--paper);
    opacity:0.025;
    user-select:none;
    pointer-events:none;
    letter-spacing:0.02em;
    z-index:1;
  }
  .stage{
    position:relative;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.2rem;
    padding:1.5rem;
    text-align:center;
    max-width:90vw;
    max-height:95vh;
    overflow-y:auto;
  }
  .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--paper-dim);
    font-weight:400;
    opacity:0;
    animation:fadeIn 0.8s ease 0.2s forwards;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:400;
    font-style:italic;
    font-size:clamp(1.4rem,4vw,2.2rem);
    line-height:1.25;
    color:var(--paper);
    max-width:18ch;
    opacity:0;
    animation:fadeIn 0.8s ease 0.4s forwards;
  }

  /* ===== ФОТО ПЕРСОНАЖА (сверху, во весь рост) ===== */
  .portrait{
    position:relative;
    width:min(40vw,180px);
    height:min(30vh,220px);
    border-radius:12px;
    overflow:hidden;
    border:1px solid rgba(232,225,208,0.12);
    background:var(--bg);
    display:none;
    margin:0 auto;
    opacity:0;
    animation:fadeIn 0.8s ease 0.1s forwards;
  }
  .portrait img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .has-portrait .portrait{ display:block; }
  @media (min-width:768px){
    .portrait{
      width:min(25vw,200px);
      height:min(35vh,260px);
    }
  }

  /* ===== ПРОФЕССИЯ ===== */
  .profession{
    display:flex;
    align-items:center;
    gap:0.6rem;
    opacity:0;
    animation:fadeIn 0.8s ease 0.5s forwards;
  }
  .profession svg{
    width:22px;
    height:22px;
    fill:var(--accent);
    opacity:0.8;
  }
  .profession span{
    font-size:0.72rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--paper-dim);
  }
  .profession:empty{ display:none; }

  /* ===== ПЕЧАТЬ (seal/player) ===== */
  .seal{
    --p:0;
    position:relative;
    width:120px;
    height:120px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, var(--bg) 62%, transparent 63%),
      conic-gradient(var(--accent) calc(var(--p)*1%), rgba(176,141,87,0.18) 0);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .25s ease;
    opacity:0;
    animation:fadeIn 0.8s ease 0.6s forwards;
    z-index:20;
  }
  .seal:active{ transform:scale(0.96); }
  .seal::before{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:50%;
    border:1px solid rgba(232,225,208,0.15);
  }
  .seal svg{ width:35%; height:35%; fill:var(--paper); }
  .seal.playing svg.icon-play{ display:none; }
  .seal:not(.playing) svg.icon-pause{ display:none; }
  .seal.playing{ animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 0 0 rgba(176,141,87,0); }
    50%{ box-shadow:0 0 20px 2px rgba(176,141,87,0.16); }
  }
  .meta{
    font-size:0.78rem;
    color:var(--paper-dim);
    letter-spacing:0.04em;
    opacity:0;
    animation:fadeIn 0.8s ease 0.7s forwards;
  }
  .overlay{
    position:fixed;
    inset:0;
    z-index:50;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.2rem;
    cursor:pointer;
    transition:opacity .6s ease;
  }
  .overlay .eyebrow{ animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:0.5;} 50%{opacity:1;} }
  .hidden{ display:none !important; }
  @media (prefers-reduced-motion: reduce){
    .seal.playing{ animation:none; }
    .overlay .eyebrow{ animation:none; }
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ===== ОРНАМЕНТЫ ===== */
  .ornament{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.08;
    background-repeat:repeat;
    background-position:center;
    mix-blend-mode:screen;
  }

  /* 1. PROLOQ */
  body.theme-prolog{ --accent:#B08D57; }
  body.theme-prolog .ornament{
    background: repeating-conic-gradient(var(--accent) 0deg 1deg, transparent 1deg 12deg);
    opacity:0.04;
  }

  /* 2. HEKAYƏ */
  body.theme-story{ --accent:#8A8378; }
  body.theme-story .ornament{
    background: repeating-linear-gradient(0deg, transparent 0 18px, var(--accent) 18px 19px, transparent 19px 36px);
    opacity:0.04;
  }

  /* 3. Ərəb — исламский фрактал */
  body.theme-arab{ --accent:#1B5E20; }
  body.theme-arab .ornament{
    background: repeating-conic-gradient(var(--accent) 0deg 15deg, transparent 15deg 30deg);
    opacity:0.05;
  }

  /* 4. İspan — фламенко (движение) */
  body.theme-spanish{ --accent:#C62828; }
  body.theme-spanish .ornament{
    background: repeating-linear-gradient(45deg, transparent 0 10px, var(--accent) 10px 11px, transparent 11px 20px),
                repeating-linear-gradient(-45deg, transparent 0 10px, var(--accent) 10px 11px, transparent 11px 20px);
    opacity:0.04;
    animation: flamencoMove 8s linear infinite;
  }
  @keyframes flamencoMove{
    0%{ background-position: 0 0, 0 0; }
    100%{ background-position: 40px 40px, -40px 40px; }
  }

  /* 5. İtalyan — реальный PNG */
  body.theme-italian{ --accent:#BF360C; }

  /* 6. İngilis — реальный SVG */
  body.theme-english{ --accent:#C62828; }

  /* 7. Hindistanlı — реальный SVG */
  body.theme-indian{ --accent:#FF6F00; }

  /* 8. Türk — реальный SVG */
  body.theme-turkish{ --accent:#00695C; }

  /* 9. Çinli — реальный SVG */
  body.theme-chinese{ --accent:#C62828; }

  /* 10 & 13. Alman — готический трилистник */
  body.theme-german{ --accent:#424242; }
  body.theme-german .ornament{
    background-image:
      radial-gradient(circle at 50% 30%, var(--accent) 3px, transparent 3px),
      radial-gradient(circle at 30% 70%, var(--accent) 3px, transparent 3px),
      radial-gradient(circle at 70% 70%, var(--accent) 3px, transparent 3px);
    background-size: 40px 40px;
    opacity:0.06;
  }

  /* 11. Yahudo — реальный SVG */
  body.theme-jewish{ --accent:#1976D2; }

  /* 12. Afrikalı — реальный SVG */
  body.theme-african{ --accent:#795548; }

  /* 14. Bəşəriyyət — спираль */
  body.theme-human{ --accent:#757575; }
  body.theme-human .ornament{
    background-image:
      radial-gradient(circle at 50% 50%, transparent 0 10px, var(--accent) 10px 11px, transparent 11px),
      radial-gradient(circle at 50% 50%, transparent 0 25px, var(--accent) 25px 26px, transparent 26px);
    background-size: 100px 100px;
    opacity:0.04;
  }

  /* 15. Epiloq */
  body.theme-epilog{ --accent:#B08D57; }
  body.theme-epilog .ornament{
    background-image:
      radial-gradient(circle at 20% 30%, var(--accent) 1px, transparent 1px),
      radial-gradient(circle at 60% 20%, var(--accent) 1px, transparent 1px),
      radial-gradient(circle at 80% 60%, var(--accent) 1px, transparent 1px);
    background-size: 100px 100px;
    opacity:0.05;
  }

  /* ===== КАРТА ===== */
  .map-badge{
    position:fixed;
    bottom:1rem;
    right:1rem;
    z-index:20;
    font-size:0.6rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--paper-dim);
    border:1px solid rgba(232,225,208,0.12);
    padding:0.3rem 0.6rem;
    border-radius:4px;
    background:rgba(14,13,12,0.6);
    backdrop-filter:blur(4px);
    opacity:0;
    animation:fadeIn 0.8s ease 0.9s forwards;
  }

  @media (prefers-reduced-motion: reduce){
    .seal.playing{ animation:none; }
    .overlay .eyebrow{ animation:none; }
    body.theme-spanish .ornament{ animation:none; }
  }
</style>
</head>
<body class="theme-spanish">

  <!-- 3D КОСМОС -->
  <canvas id="cosmos"></canvas>

  <div class="numeral">IV</div>
  <div class="ornament" style="background-image: url('../../assets/ornaments/spanish_moorish_tile.svg'); background-size: 200px 200px; background-repeat: repeat; opacity: 0.08;"></div>

  <div class="stage has-portrait">
    <div class="eyebrow">Bəb 4</div>
    <div class="portrait"><img src="../../assets/pictures/person_4.jpg" alt="Gün 2 - Vurğun (İspan)"></div>
    <h1>Gün 2 - Vurğun (İspan)</h1>
    <div class="profession">
      <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg><span>Vurğun</span>
    </div>
    <button class="seal" id="playBtn" aria-label="Oynat">
      <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="meta" id="timeLabel">00:00 / 00:00</div>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="numeral">IV</div>
    <div class="eyebrow" style="position:relative;z-index:1;">Başlamaq üçün klikləyin</div>
  </div>

  <audio id="audio" src="../../audio/track4.mp3" preload="auto"></audio>

  <div class="map-badge">İspaniya</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  /* ===== 3D КОСМОС ===== */
  (function(){
    var canvas = document.getElementById('cosmos');
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    var starCount = 1500;
    var starGeo = new THREE.BufferGeometry();
    var starPos = new Float32Array(starCount * 3);
    var starSizes = new Float32Array(starCount);
    for(var i = 0; i < starCount; i++){
      starPos[i*3] = (Math.random() - 0.5) * 20;
      starPos[i*3+1] = (Math.random() - 0.5) * 20;
      starPos[i*3+2] = (Math.random() - 0.5) * 20;
      starSizes[i] = Math.random() * 2 + 0.5;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));

    var starMat = new THREE.PointsMaterial({
      color: 0xE8E1D0,
      size: 0.03,
      transparent: true,
      opacity: 0.7,
      sizeAttenuation: true
    });
    var stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    var nebulaGeo = new THREE.SphereGeometry(8, 32, 32);
    var nebulaMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color('#1565C0'),
      transparent: true,
      opacity: 0.03,
      side: THREE.BackSide
    });
    var nebula = new THREE.Mesh(nebulaGeo, nebulaMat);
    scene.add(nebula);

    var soulGeo = new THREE.SphereGeometry(0.25, 32, 32);
    var soulMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color('#87CEEB'),
      transparent: true,
      opacity: 0.12
    });
    var soul = new THREE.Mesh(soulGeo, soulMat);
    scene.add(soul);

    var mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', function(e){
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    function animate(){
      requestAnimationFrame(animate);
      stars.rotation.y += 0.0003;
      stars.rotation.x += 0.0001;
      soul.rotation.y += 0.005;
      soul.rotation.x += 0.003;
      camera.position.x += (mouseX * 0.3 - camera.position.x) * 0.02;
      camera.position.y += (-mouseY * 0.3 - camera.position.y) * 0.02;
      camera.lookAt(scene.position);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', function(){
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  })();

  /* ===== ЧАСТИЦЫ ===== */
  (function(){
    var container = document.createElement('div');
    container.className = 'particles';
    container.style.cssText = 'position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;';
    document.body.appendChild(container);
    var count = 20;
    for(var i = 0; i < count; i++){
      var p = document.createElement('div');
      p.style.cssText = 'position:absolute;width:2px;height:2px;background:var(--paper);border-radius:50%;opacity:0;animation:starFloat ' + (4+Math.random()*4) + 's ease-in-out ' + (Math.random()*6) + 's infinite;';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      container.appendChild(p);
    }
  })();

  /* ===== АУДИО ПЛЕЕР ===== */
  const audio = document.getElementById('audio');
  const seal = document.getElementById('playBtn');
  const overlay = document.getElementById('startOverlay');
  const timeLabel = document.getElementById('timeLabel');

  function fmt(s){
    if(!isFinite(s)) return '00:00';
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  }

  function updateProgress(){
    const p = audio.duration ? (audio.currentTime/audio.duration)*100 : 0;
    seal.style.setProperty('--p', p.toFixed(2));
    timeLabel.textContent = fmt(audio.currentTime)+' / '+fmt(audio.duration);
  }

  function play(){
    audio.play().then(()=>{
      seal.classList.add('playing');
      overlay.classList.add('hidden');
    }).catch(()=>{
      overlay.classList.remove('hidden');
    });
  }

  function toggle(){
    if(audio.paused){ play(); }
    else{ audio.pause(); seal.classList.remove('playing'); }
  }

  seal.addEventListener('click', toggle);
  overlay.addEventListener('click', ()=>{ overlay.classList.add('hidden'); play(); });
  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('ended', ()=>{ seal.classList.remove('playing'); });

  window.addEventListener('load', play);
</script>
<style>
  @keyframes starFloat{
    0%{ opacity:0; transform:translateY(0) scale(0.5); }
    50%{ opacity:0.6; transform:translateY(-30px) scale(1); }
    100%{ opacity:0; transform:translateY(-60px) scale(0.5); }
  }
</style>
</body>
</html>
