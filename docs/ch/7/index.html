<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D0C">
<title>Gün 5 - Musiqiçi - -Hindistanlı — Simasız Büt — bə 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0D0C;
    --paper:#E8E1D0;
    --paper-dim:#8A8378;
    --gold:#B08D57;
    --wine:#7A2E2E;
    --accent:#B08D57;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:'Work Sans',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* ===== БАЗОВЫЙ ДИЗАЙН (утверждён) ===== */
  .numeral{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond',serif;
    font-size:min(60vw,60vh);
    font-weight:600;
    color:var(--paper);
    opacity:0.045;
    user-select:none;
    pointer-events:none;
    letter-spacing:0.02em;
    z-index:0;
  }
  .stage{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2.4rem;
    padding:2rem;
    text-align:center;
  }
  .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--paper-dim);
    font-weight:400;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:400;
    font-style:italic;
    font-size:clamp(1.6rem,5vw,2.6rem);
    line-height:1.25;
    color:var(--paper);
    max-width:16ch;
  }
  .portrait{
    position:absolute;
    left:2rem;
    top:50%;
    transform:translateY(-50%);
    width:min(28vw,200px);
    height:min(60vh,360px);
    border-radius:12px;
    overflow:hidden;
    border:1px solid rgba(232,225,208,0.12);
    background:var(--bg);
    display:none;
    z-index:0;
  }
  .portrait img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .has-portrait .portrait{ display:block; }
  @media (max-width:768px){
    .portrait{
      position:relative;
      left:auto;
      top:auto;
      transform:none;
      width:min(40vw,160px);
      height:min(30vh,200px);
      margin:0 auto;
      z-index:1;
    }
  }
  .seal{
    --p:0;
    position:relative;
    width:min(38vw,168px);
    height:min(38vw,168px);
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, var(--bg) 62%, transparent 63%),
      conic-gradient(var(--accent) calc(var(--p)*1%), rgba(176,141,87,0.18) 0);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .25s ease;
  }
  .seal:active{ transform:scale(0.96); }
  .seal::before{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:50%;
    border:1px solid rgba(232,225,208,0.15);
  }
  .seal svg{ width:30%; height:30%; fill:var(--paper); }
  .seal.playing svg.icon-play{ display:none; }
  .seal:not(.playing) svg.icon-pause{ display:none; }
  .seal.playing{ animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 0 0 rgba(176,141,87,0); }
    50%{ box-shadow:0 0 24px 2px rgba(176,141,87,0.16); }
  }
  .meta{
    font-size:0.78rem;
    color:var(--paper-dim);
    letter-spacing:0.04em;
  }
  .overlay{
    position:fixed;
    inset:0;
    z-index:5;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.2rem;
    cursor:pointer;
  }
  .overlay .eyebrow{ animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:0.5;} 50%{opacity:1;} }
  .hidden{ display:none !important; }
  @media (prefers-reduced-motion: reduce){
    .seal.playing{ animation:none; }
    .overlay .eyebrow{ animation:none; }
  }

  /* ===== ОРНАМЕНТЫ ПО НАЦИОНАЛЬНОСТЯМ ===== */
  .ornament{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.07;
  }

  /* 1. PROLOQ — золотые лучи */
  body.theme-prolog .ornament{
    background: repeating-conic-gradient(var(--accent) 0deg 1deg, transparent 1deg 12deg);
  }
  body.theme-prolog{ --accent:#B08D57; }

  /* 2. HEKAYƏ — волны */
  body.theme-story .ornament{
    background: repeating-linear-gradient(0deg, transparent 0 18px, var(--accent) 18px 19px, transparent 19px 36px);
  }
  body.theme-story{ --accent:#8A8378; }

  /* 3. Ərəb — шиитские элементы: геометрический узор с куфической вязью */
  body.theme-arab .ornament{
    background-image:
      linear-gradient(45deg, var(--accent) 1px, transparent 1px),
      linear-gradient(-45deg, var(--accent) 1px, transparent 1px),
      radial-gradient(circle at 50% 50%, var(--accent) 2px, transparent 2px);
    background-size: 30px 30px, 30px 30px, 60px 60px;
    background-position: 0 0, 0 0, 15px 15px;
  }
  body.theme-arab{ --accent:#1B5E20; }

  /* 4. İspan — испанская керамика (азулежу) */
  body.theme-spanish .ornament{
    background-image:
      linear-gradient(45deg, var(--accent) 25%, transparent 25%),
      linear-gradient(-45deg, var(--accent) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--accent) 75%),
      linear-gradient(-45deg, transparent 75%, var(--accent) 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
  }
  body.theme-spanish{ --accent:#1565C0; }

  /* 5. İtalyan — акант (листья аканта) */
  body.theme-italian .ornament{
    background-image:
      radial-gradient(ellipse at 30% 20%, var(--accent) 3px, transparent 3px),
      radial-gradient(ellipse at 70% 40%, var(--accent) 2px, transparent 2px),
      radial-gradient(ellipse at 20% 70%, var(--accent) 2px, transparent 2px),
      radial-gradient(ellipse at 80% 80%, var(--accent) 3px, transparent 3px),
      repeating-linear-gradient(60deg, transparent 0 15px, var(--accent) 15px 16px, transparent 16px 30px);
    background-size: 60px 60px;
  }
  body.theme-italian{ --accent:#BF360C; }

  /* 6. İngilis — роза Тюдоров */
  body.theme-english .ornament{
    background-image:
      radial-gradient(circle at 50% 50%, var(--accent) 4px, transparent 4px),
      radial-gradient(circle at 50% 50%, transparent 8px, var(--accent) 8px, transparent 9px),
      radial-gradient(circle at 50% 50%, transparent 14px, var(--accent) 14px, transparent 15px);
    background-size: 40px 40px;
  }
  body.theme-english{ --accent:#C62828; }

  /* 7. Hindistanlı — мандала с лотосом */
  body.theme-indian .ornament{
    background-image:
      radial-gradient(circle at 50% 50%, var(--accent) 2px, transparent 2px),
      radial-gradient(circle at 50% 50%, transparent 12px, var(--accent) 12px, transparent 13px),
      radial-gradient(circle at 50% 50%, transparent 24px, var(--accent) 24px, transparent 25px),
      radial-gradient(circle at 50% 50%, transparent 36px, var(--accent) 36px, transparent 37px);
    background-size: 80px 80px;
  }
  body.theme-indian{ --accent:#FF6F00; }

  /* 8. Türk — символы древних тюрков (тамга, волк, солнце) */
  body.theme-turkish .ornament{
    background-image:
      radial-gradient(circle at 50% 40%, var(--accent) 6px, transparent 6px),
      radial-gradient(circle at 30% 70%, var(--accent) 2px, transparent 2px),
      radial-gradient(circle at 70% 70%, var(--accent) 2px, transparent 2px),
      linear-gradient(45deg, var(--accent) 1px, transparent 1px),
      linear-gradient(-45deg, var(--accent) 1px, transparent 1px);
    background-size: 50px 50px, 50px 50px, 50px 50px, 25px 25px, 25px 25px;
  }
  body.theme-turkish{ --accent:#00695C; }

  /* 9. Çinli — дракон и облака */
  body.theme-chinese .ornament{
    background-image:
      radial-gradient(ellipse at 20% 30%, var(--accent) 8px, transparent 8px),
      radial-gradient(ellipse at 60% 20%, var(--accent) 6px, transparent 6px),
      radial-gradient(ellipse at 80% 60%, var(--accent) 10px, transparent 10px),
      radial-gradient(ellipse at 40% 80%, var(--accent) 7px, transparent 7px),
      radial-gradient(ellipse at 10% 60%, var(--accent) 5px, transparent 5px);
    background-size: 120px 120px;
  }
  body.theme-chinese{ --accent:#C62828; }

  /* 10 & 13. Alman — готический трилистник */
  body.theme-german .ornament{
    background-image:
      radial-gradient(circle at 50% 30%, var(--accent) 3px, transparent 3px),
      radial-gradient(circle at 30% 70%, var(--accent) 3px, transparent 3px),
      radial-gradient(circle at 70% 70%, var(--accent) 3px, transparent 3px),
      radial-gradient(circle at 50% 50%, var(--accent) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  body.theme-german{ --accent:#424242; }

  /* 11. Yahudo — менора (семисвечник) */
  body.theme-jewish .ornament{
    background-image:
      linear-gradient(90deg, transparent 0 48%, var(--accent) 48% 52%, transparent 52% 100%),
      radial-gradient(circle at 50% 30%, var(--accent) 2px, transparent 2px),
      radial-gradient(circle at 20% 50%, var(--accent) 2px, transparent 2px),
      radial-gradient(circle at 80% 50%, var(--accent) 2px, transparent 2px),
      radial-gradient(circle at 35% 65%, var(--accent) 2px, transparent 2px),
      radial-gradient(circle at 65% 65%, var(--accent) 2px, transparent 2px);
    background-size: 60px 60px;
    opacity:0.05;
  }
  body.theme-jewish{ --accent:#1976D2; }

  /* 12. Afrikalı — адинкра (Gye Nyame) */
  body.theme-african .ornament{
    background-image:
      radial-gradient(circle at 50% 50%, var(--accent) 3px, transparent 3px),
      linear-gradient(45deg, var(--accent) 1px, transparent 1px),
      linear-gradient(-45deg, var(--accent) 1px, transparent 1px);
    background-size: 50px 50px, 25px 25px, 25px 25px;
    opacity:0.06;
  }
  body.theme-african{ --accent:#795548; }

  /* 14. Bəşəriyyət — спираль (эволюция) */
  body.theme-human .ornament{
    background-image:
      radial-gradient(circle at 50% 50%, transparent 0 10px, var(--accent) 10px 11px, transparent 11px),
      radial-gradient(circle at 50% 50%, transparent 0 25px, var(--accent) 25px 26px, transparent 26px),
      radial-gradient(circle at 50% 50%, transparent 0 40px, var(--accent) 40px 41px, transparent 41px);
    background-size: 100px 100px;
    opacity:0.04;
  }
  body.theme-human{ --accent:#757575; }

  /* 15. Epiloq — звёздное небо */
  body.theme-epilog .ornament{
    background-image:
      radial-gradient(circle at 20% 30%, var(--accent) 1px, transparent 1px),
      radial-gradient(circle at 60% 20%, var(--accent) 1px, transparent 1px),
      radial-gradient(circle at 80% 60%, var(--accent) 1px, transparent 1px),
      radial-gradient(circle at 40% 80%, var(--accent) 1px, transparent 1px),
      radial-gradient(circle at 10% 70%, var(--accent) 1px, transparent 1px);
    background-size: 100px 100px;
    opacity:0.05;
  }
  body.theme-epilog{ --accent:#B08D57; }
</style>
</head>
<body class="theme-indian">

  <div class="numeral">VII</div>
  <div class="ornament"></div>

  <div class="stage has-portrait">
    <div class="eyebrow">Bəb 7</div>
    <div class="portrait"><img src="../../assets/pictures/person_7.jpg" alt="Gün 5 - Musiqiçi - -Hindistanlı"></div>
    <h1>Gün 5 - Musiqiçi - -Hindistanlı</h1>
    <button class="seal" id="playBtn" aria-label="Oynat">
      <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="meta" id="timeLabel">00:00 / 00:00</div>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="numeral">VII</div>
    <div class="eyebrow" style="position:relative;z-index:1;">Başlamaq üçün klikləyin</div>
  </div>

  <audio id="audio" src="../../audio/track7.mp3" preload="auto"></audio>

<script>
  const audio = document.getElementById('audio');
  const seal = document.getElementById('playBtn');
  const overlay = document.getElementById('startOverlay');
  const timeLabel = document.getElementById('timeLabel');

  function fmt(s){
    if(!isFinite(s)) return '00:00';
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  }

  function updateProgress(){
    const p = audio.duration ? (audio.currentTime/audio.duration)*100 : 0;
    seal.style.setProperty('--p', p.toFixed(2));
    timeLabel.textContent = fmt(audio.currentTime)+' / '+fmt(audio.duration);
  }

  function play(){
    audio.play().then(()=>{
      seal.classList.add('playing');
      overlay.classList.add('hidden');
    }).catch(()=>{
      overlay.classList.remove('hidden');
    });
  }

  function toggle(){
    if(audio.paused){ play(); }
    else{ audio.pause(); seal.classList.remove('playing'); }
  }

  seal.addEventListener('click', toggle);
  overlay.addEventListener('click', ()=>{ overlay.classList.add('hidden'); play(); });
  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('ended', ()=>{ seal.classList.remove('playing'); });

  window.addEventListener('load', play);
</script>
</body>
</html>
