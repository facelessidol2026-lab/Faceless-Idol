<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D0C">
<title>PROLOQ — Simasız Büt — fəsil 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@300;400;500&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Arabic:wght@300;400;700&family=Noto+Sans+Devanagari:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;700&family=Noto+Sans+Hebrew:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0D0C;
    --bg2:#15130F;
    --paper:#E8E1D0;
    --paper-dim:#8A8378;
    --gold:#B08D57;
    --wine:#7A2E2E;
    --accent:#B08D57;
    --astral:#7B68EE;
    --soul:#FFD700;
    --glow:rgba(176,141,87,0.15);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:'Work Sans',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* ===== ФОН ===== */
  .bg-layer{
    position:fixed;
    inset:0;
    z-index:0;
    background: radial-gradient(ellipse at 50% 50%, var(--bg2) 0%, var(--bg) 100%);
  }

  /* ===== ОРНАМЕНТ (фоновый, видимый) ===== */
  .ornament{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    opacity:0.18;
    background-repeat:repeat;
    background-position:center;
    mix-blend-mode:screen;
  }
  .ornament-img{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    opacity:0.25;
    background-repeat:repeat;
    background-position:center;
    background-size:300px 300px;
    mix-blend-mode:screen;
  }

  /* ===== 3D КОСМОС ===== */
  #cosmos{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }

  /* ===== НУМЕРАЛ (фоновый) ===== */
  .numeral{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond',serif;
    font-size:min(40vw,40vh);
    font-weight:600;
    color:var(--paper);
    opacity:0.02;
    user-select:none;
    pointer-events:none;
    letter-spacing:0.02em;
    z-index:2;
  }

  /* ===== ПЛАВАЮЩИЕ БУКВЫ ===== */
  .floating-letters{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    overflow:hidden;
  }
  .floating-letter{
    position:absolute;
    font-size:clamp(1.5rem, 4vw, 3rem);
    opacity:0;
    color:var(--accent);
    animation: floatLetter 12s ease-in-out infinite;
    user-select:none;
    pointer-events:none;
    font-family: 'Amiri', 'Noto Sans Arabic', 'Noto Sans Devanagari', 'Noto Sans SC', 'Noto Sans Hebrew', serif;
    text-shadow: 0 0 10px var(--accent);
  }
  @keyframes floatLetter{
    0%{ opacity:0; transform:translateY(100vh) scale(0.5) rotate(0deg); }
    10%{ opacity:0.25; }
    50%{ opacity:0.4; transform:translateY(-20vh) scale(1) rotate(10deg); }
    90%{ opacity:0.15; }
    100%{ opacity:0; transform:translateY(-120vh) scale(0.5) rotate(-10deg); }
  }

  /* ===== АСТРАЛЬНАЯ НИТЬ ===== */
  .astral-thread{
    position:fixed;
    top:0;
    left:50%;
    width:2px;
    height:100%;
    background:linear-gradient(to bottom, transparent 0%, var(--astral) 20%, var(--soul) 50%, var(--astral) 80%, transparent 100%);
    opacity:0.12;
    z-index:1;
    pointer-events:none;
    animation:threadPulse 4s ease-in-out infinite;
  }
  @keyframes threadPulse{
    0%,100%{ opacity:0.08; }
    50%{ opacity:0.2; }
  }

  /* ===== ЧАСТИЦЫ (ЗВЁЗДЫ) ===== */
  .particles{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  .particle{
    position:absolute;
    width:2px;
    height:2px;
    background:var(--paper);
    border-radius:50%;
    opacity:0;
    animation:starFloat 8s ease-in-out infinite;
  }
  @keyframes starFloat{
    0%{ opacity:0; transform:translateY(0) scale(0.5); }
    50%{ opacity:0.5; transform:translateY(-40px) scale(1); }
    100%{ opacity:0; transform:translateY(-80px) scale(0.5); }
  }

  /* ===== ГЛАВНАЯ СЦЕНА ===== */
  .stage{
    position:relative;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.2rem;
    padding:1.5rem;
    text-align:center;
    max-width:90vw;
    max-height:95vh;
    overflow-y:auto;
  }
  .eyebrow{
    font-size:0.65rem;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color:var(--paper-dim);
    font-weight:400;
    opacity:0;
    animation:fadeIn 0.6s ease 0.1s forwards;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:400;
    font-style:italic;
    font-size:clamp(1.4rem,4.5vw,2.2rem);
    line-height:1.25;
    color:var(--paper);
    max-width:22ch;
    opacity:0;
    animation:fadeIn 0.6s ease 0.2s forwards;
    text-shadow:0 0 20px rgba(176,141,87,0.1);
  }

  /* ===== ФОТО ПЕРСОНАЖА ===== */
  .portrait{
    position:relative;
    width:min(40vw,170px);
    height:min(28vh,200px);
    border-radius:12px;
    overflow:hidden;
    border:1px solid rgba(232,225,208,0.15);
    background:var(--bg);
    display:none;
    margin:0 auto;
    opacity:0;
    animation:fadeIn 0.6s ease 0.05s forwards;
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
  }
  .portrait img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .has-portrait .portrait{ display:block; }
  @media (min-width:768px){
    .portrait{
      width:min(22vw,200px);
      height:min(32vh,240px);
    }
  }

  /* ===== ПРОФЕССИЯ ===== */
  .profession{
    display:flex;
    align-items:center;
    gap:0.5rem;
    opacity:0;
    animation:fadeIn 0.6s ease 0.3s forwards;
  }
  .profession svg{
    width:20px;
    height:20px;
    fill:var(--accent);
    opacity:0.9;
    filter:drop-shadow(0 0 4px var(--accent));
  }
  .profession span{
    font-size:0.68rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--paper-dim);
  }
  .profession:empty{ display:none; }

  /* ===== ПЕЧАТЬ (seal/player) ===== */
  .seal{
    --p:0;
    position:relative;
    width:110px;
    height:110px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, var(--bg) 60%, transparent 61%),
      conic-gradient(var(--accent) calc(var(--p)*1%), rgba(176,141,87,0.15) 0);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;
    opacity:0;
    animation:fadeIn 0.6s ease 0.4s forwards;
    z-index:20;
    box-shadow:0 0 20px rgba(176,141,87,0.1);
  }
  .seal:active{ transform:scale(0.96); }
  .seal::before{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:50%;
    border:1px solid rgba(232,225,208,0.2);
  }
  .seal svg{ width:32%; height:32%; fill:var(--paper); }
  .seal.playing svg.icon-play{ display:none; }
  .seal:not(.playing) svg.icon-pause{ display:none; }
  .seal.playing{ animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 0 0 rgba(176,141,87,0); }
    50%{ box-shadow:0 0 30px 4px rgba(176,141,87,0.2); }
  }
  .meta{
    font-size:0.72rem;
    color:var(--paper-dim);
    letter-spacing:0.04em;
    opacity:0;
    animation:fadeIn 0.6s ease 0.5s forwards;
  }

  /* ===== OVERLAY ===== */
  .overlay{
    position:fixed;
    inset:0;
    z-index:50;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1rem;
    cursor:pointer;
    transition:opacity .6s ease;
  }
  .overlay .eyebrow{ animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:0.4;} 50%{opacity:1;} }
  .hidden{ display:none !important; }

  /* ===== КАРТА ===== */
  .map-badge{
    position:fixed;
    bottom:1rem;
    right:1rem;
    z-index:20;
    font-size:0.6rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--paper-dim);
    border:1px solid rgba(232,225,208,0.15);
    padding:0.35rem 0.7rem;
    border-radius:4px;
    background:rgba(14,13,12,0.7);
    backdrop-filter:blur(8px);
    opacity:0;
    animation:fadeIn 0.6s ease 0.9s forwards;
  }

  /* ===== ТЕМЫ (цвета) ===== */
  body.theme-prolog{ --accent:#B08D57; }
  body.theme-story{ --accent:#8A8378; }
  body.theme-arab{ --accent:#1B5E20; }
  body.theme-spanish{ --accent:#C62828; }
  body.theme-italian{ --accent:#BF360C; }
  body.theme-english{ --accent:#C62828; }
  body.theme-indian{ --accent:#FF6F00; }
  body.theme-turkish{ --accent:#00695C; }
  body.theme-chinese{ --accent:#C62828; }
  body.theme-german{ --accent:#424242; }
  body.theme-jewish{ --accent:#1976D2; }
  body.theme-african{ --accent:#795548; }
  body.theme-human{ --accent:#757575; }
  body.theme-epilog{ --accent:#B08D57; }

  /* ===== ОРНАМЕНТЫ CSS (для глав без изображений) ===== */
  body.theme-prolog .ornament{
    background: repeating-conic-gradient(var(--accent) 0deg 1deg, transparent 1deg 12deg);
    opacity:0.06;
  }
  body.theme-story .ornament{
    background: repeating-linear-gradient(0deg, transparent 0 18px, var(--accent) 18px 19px, transparent 19px 36px);
    opacity:0.06;
  }
  body.theme-arab .ornament{
    background: repeating-conic-gradient(var(--accent) 0deg 15deg, transparent 15deg 30deg);
    opacity:0.12;
  }
  body.theme-turkish .ornament{
    background-image:
      radial-gradient(circle at 25% 25%, var(--accent) 12px, transparent 12px),
      radial-gradient(circle at 75% 25%, var(--accent) 8px, transparent 8px),
      radial-gradient(circle at 50% 75%, var(--accent) 14px, transparent 14px);
    background-size: 80px 80px;
    opacity:0.2;
  }
  body.theme-german .ornament{
    background-image:
      radial-gradient(circle at 50% 30%, var(--accent) 3px, transparent 3px),
      radial-gradient(circle at 30% 70%, var(--accent) 3px, transparent 3px),
      radial-gradient(circle at 70% 70%, var(--accent) 3px, transparent 3px);
    background-size: 40px 40px;
    opacity:0.1;
  }
  body.theme-jewish .ornament{
    background-image:
      radial-gradient(circle at 50% 30%, var(--accent) 3px, transparent 3px),
      radial-gradient(circle at 20% 50%, var(--accent) 2px, transparent 2px),
      radial-gradient(circle at 80% 50%, var(--accent) 2px, transparent 2px);
    background-size: 60px 60px;
    opacity:0.15;
  }
  body.theme-african .ornament{
    background-image:
      radial-gradient(circle at 50% 50%, var(--accent) 3px, transparent 3px),
      linear-gradient(45deg, var(--accent) 1px, transparent 1px),
      linear-gradient(-45deg, var(--accent) 1px, transparent 1px);
    background-size: 50px 50px, 25px 25px, 25px 25px;
    opacity:0.15;
  }
  body.theme-human .ornament{
    background-image:
      radial-gradient(circle at 50% 50%, transparent 0 10px, var(--accent) 10px 11px, transparent 11px),
      radial-gradient(circle at 50% 50%, transparent 0 25px, var(--accent) 25px 26px, transparent 26px);
    background-size: 100px 100px;
    opacity:0.1;
  }
  body.theme-epilog .ornament{
    background-image:
      radial-gradient(circle at 20% 30%, var(--accent) 1px, transparent 1px),
      radial-gradient(circle at 60% 20%, var(--accent) 1px, transparent 1px),
      radial-gradient(circle at 80% 60%, var(--accent) 1px, transparent 1px);
    background-size: 100px 100px;
    opacity:0.1;
  }

  /* ===== СТИЛИ ДЛЯ РЕАЛЬНЫХ ИЗОБРАЖЕНИЙ ===== */
  body.theme-spanish .ornament-img{
    background-image: url('../../assets/ornaments/spanish_flamenco.png');
  }
  body.theme-italian .ornament-img{
    background-image: url('../../assets/ornaments/italian_venetian_mask.png');
  }
  body.theme-english .ornament-img{
    background-image: url('../../assets/ornaments/english_celtic_knot.png');
  }
  body.theme-indian .ornament-img{
    background-image: url('../../assets/ornaments/indian_mandala.svg');
  }
  body.theme-chinese .ornament-img{
    background-image: url('../../assets/ornaments/chinese_dragon.svg');
  }
  body.theme-jewish .ornament-img{
    background-image: url('../../assets/ornaments/jewish_menorah.svg');
    filter: invert(1) brightness(1.5);
  }
  body.theme-african .ornament-img{
    background-image: url('../../assets/ornaments/african_gye_nyame.svg');
  }

  @media (prefers-reduced-motion: reduce){
    .seal.playing{ animation:none; }
    .overlay .eyebrow{ animation:none; }
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body class="theme-prolog">

  <!-- 3D КОСМОС -->
  <canvas id="cosmos"></canvas>

  <div class="bg-layer"></div>
  <div class="numeral">I</div>
  <div class="ornament" style=""></div>
  <div class="ornament-img"></div>
  <div class="floating-letters" id="floatingLetters"></div>

  <div class="stage">
    <div class="eyebrow">Fəsil 1</div>
    
    <h1>PROLOQ</h1>
    <div class="profession">
      
    </div>
    <button class="seal" id="playBtn" aria-label="Oynat">
      <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="meta" id="timeLabel">00:00 / 00:00</div>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="numeral">I</div>
    <div class="eyebrow" style="position:relative;z-index:1;">Başlamaq üçün klikləyin</div>
  </div>

  <audio id="audio" src="../../audio/track1.mp3" preload="auto"></audio>

  <div class="map-badge"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  /* ===== 3D КОСМОС ===== */
  (function(){
    var canvas = document.getElementById('cosmos');
    if(!canvas) return;
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    var starCount = 1200;
    var starGeo = new THREE.BufferGeometry();
    var starPos = new Float32Array(starCount * 3);
    for(var i = 0; i < starCount; i++){
      starPos[i*3] = (Math.random() - 0.5) * 20;
      starPos[i*3+1] = (Math.random() - 0.5) * 20;
      starPos[i*3+2] = (Math.random() - 0.5) * 20;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));

    var starMat = new THREE.PointsMaterial({
      color: 0xE8E1D0,
      size: 0.03,
      transparent: true,
      opacity: 0.5,
      sizeAttenuation: true
    });
    var stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    var nebulaGeo = new THREE.SphereGeometry(8, 32, 32);
    var nebulaMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color('#B08D57'),
      transparent: true,
      opacity: 0.02,
      side: THREE.BackSide
    });
    var nebula = new THREE.Mesh(nebulaGeo, nebulaMat);
    scene.add(nebula);

    var soulGeo = new THREE.SphereGeometry(0.2, 32, 32);
    var soulMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color('#FFD700'),
      transparent: true,
      opacity: 0.08
    });
    var soul = new THREE.Mesh(soulGeo, soulMat);
    scene.add(soul);

    var mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', function(e){
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    function animate(){
      requestAnimationFrame(animate);
      stars.rotation.y += 0.0003;
      stars.rotation.x += 0.0001;
      soul.rotation.y += 0.005;
      soul.rotation.x += 0.003;
      camera.position.x += (mouseX * 0.2 - camera.position.x) * 0.02;
      camera.position.y += (-mouseY * 0.2 - camera.position.y) * 0.02;
      camera.lookAt(scene.position);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', function(){
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  })();

  /* ===== ПЛАВАЮЩИЕ БУКВЫ ===== */
  (function(){
    var container = document.getElementById('floatingLetters');
    var letters = 'I,V,X,★,✦,✧'.split(',');
    var count = 15;
    for(var i = 0; i < count; i++){
      var el = document.createElement('div');
      el.className = 'floating-letter';
      el.textContent = letters[Math.floor(Math.random() * letters.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDelay = Math.random() * 8 + 's';
      el.style.animationDuration = (8 + Math.random() * 6) + 's';
      container.appendChild(el);
    }
  })();

  /* ===== АУДИО ПЛЕЕР ===== */
  const audio = document.getElementById('audio');
  const seal = document.getElementById('playBtn');
  const overlay = document.getElementById('startOverlay');
  const timeLabel = document.getElementById('timeLabel');

  function fmt(s){
    if(!isFinite(s)) return '00:00';
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  }

  function updateProgress(){
    const p = audio.duration ? (audio.currentTime/audio.duration)*100 : 0;
    seal.style.setProperty('--p', p.toFixed(2));
    timeLabel.textContent = fmt(audio.currentTime)+' / '+fmt(audio.duration);
  }

  function play(){
    audio.play().then(()=>{
      seal.classList.add('playing');
      overlay.classList.add('hidden');
    }).catch(()=>{
      overlay.classList.remove('hidden');
    });
  }

  function toggle(){
    if(audio.paused){ play(); }
    else{ audio.pause(); seal.classList.remove('playing'); }
  }

  seal.addEventListener('click', toggle);
  overlay.addEventListener('click', ()=>{ overlay.classList.add('hidden'); play(); });
  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('ended', ()=>{ seal.classList.remove('playing'); });

  window.addEventListener('load', play);
</script>
</body>
</html>
