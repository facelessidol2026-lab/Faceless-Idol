<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0D0C">
<title>Səhifə tapılmadı — Faceless-Idol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0D0C;
    --paper:#E8E1D0;
    --paper-dim:#8A8378;
    --gold:#B08D57;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:'Work Sans',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:1rem;
  }
  .card{
    max-width:420px;
    padding:2.5rem 2rem;
    border:1px solid rgba(232,225,208,0.12);
    border-radius:16px;
    background:rgba(232,225,208,0.02);
  }
  .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--paper-dim);
    font-weight:400;
    margin-bottom:1rem;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:400;
    font-style:italic;
    font-size:clamp(1.8rem,6vw,2.6rem);
    line-height:1.25;
    color:var(--paper);
    margin-bottom:1rem;
  }
  p{
    font-size:0.9rem;
    color:var(--paper-dim);
    margin-bottom:1.5rem;
  }
  a{
    color:var(--gold);
    text-decoration:none;
    border-bottom:1px solid rgba(176,141,87,0.4);
  }
  a:hover{ border-bottom-color:var(--gold); }
</style>
</head>
<body>

  <div class="card">
    <div class="eyebrow">404</div>
    <h1>Səhifə tapılmadı</h1>
    <p>Axtarğınız səhifə burada deyil. Baş səhifəyə dönün və səbəni seçin.</p>
    <a href="/">Baş səhifəyə get</a>
  </div>

</body>
</html>
